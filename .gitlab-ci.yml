stages:
  - lint
  - test
  - build
  - publish

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

cache:
  paths:
    - .pip-cache/

lint:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install ruff
    - ruff check heyducky/ tests/
    - ruff format --check heyducky/ tests/

.test-template: &test-template
  stage: test
  before_script:
    - apt-get update && apt-get install -y portaudio19-dev
    - pip install -e ".[dev]"
  script:
    - pytest tests/ -v

test-3.10:
  <<: *test-template
  image: python:3.10-slim

test-3.11:
  <<: *test-template
  image: python:3.11-slim

test-3.12:
  <<: *test-template
  image: python:3.12-slim

test-3.13:
  <<: *test-template
  image: python:3.13-slim

build:
  stage: build
  image: python:3.12-slim
  script:
    - pip install build
    - python -m build
  artifacts:
    paths:
      - dist/

publish:
  stage: publish
  image: python:3.12-slim
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - pip install twine
    - twine upload dist/*
