[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heyducky"
version = "0.1.0"
description = "HeyDucky — your AI rubber duck that actually talks back. Voice-controlled debugging assistant for your terminal."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Idan G" }]
keywords = ["debugger", "voice", "ai", "tui", "dap", "claude", "rubber-duck", "heyducky", "debugging-assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "textual>=0.50.0",
    "rich>=13.7.0",
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.26.0",
    "anthropic>=0.40.0",
    "toml>=0.10.2",
    "debugpy>=1.8.0",
]

[project.optional-dependencies]
tts = ["elevenlabs>=1.0.0"]
remote = [
    "PySide6>=6.5.0",
    "psutil>=5.9.0",
    "qasync>=0.27.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "twine>=5.0.0",
    "build>=1.0.0",
    "psutil>=5.9.0",
]

[project.urls]
Homepage = "https://github.com/IdanG7/HeyDucky"
Repository = "https://github.com/IdanG7/HeyDucky"
Issues = "https://github.com/IdanG7/HeyDucky/issues"
Changelog = "https://github.com/IdanG7/HeyDucky/blob/master/CHANGELOG.md"

[project.scripts]
ducky = "heyducky.__main__:main"
ducky-remote = "heyducky.remote.__main__:main"

[tool.hatch.build.targets.sdist]
include = ["heyducky/", "LICENSE", "README.md"]

[tool.hatch.build.targets.wheel]
packages = ["heyducky"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM108", # ternary operator (readability preference)
]

[tool.ruff.lint.isort]
known-first-party = ["heyducky"]
